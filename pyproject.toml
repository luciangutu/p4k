[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "p4k"
version = "0.1.0"
description = "Terminal changelist browser for Perforce, in the spirit of gitk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual==8.2.8"]
keywords = ["perforce", "p4", "helix-core", "tui", "terminal", "changelist", "diff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucian Gutu", email = "luciangutu@gmail.com" }]
# TODO before release: add [project.urls] (Homepage, Repository, Issues).

[project.scripts]
p4k = "p4k.app:main"

[tool.setuptools.packages.find]
include = ["p4k*"]
