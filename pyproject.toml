[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "p4k"
dynamic = ["version"]
description = "Terminal changelist browser for Perforce, in the spirit of gitk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual==8.2.8"]
keywords = ["perforce", "p4", "helix-core", "tui", "terminal", "changelist", "diff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lucian Gutu", email = "luciangutu@gmail.com" }]

[project.urls]
Homepage = "https://github.com/luciangutu/p4k"
Repository = "https://github.com/luciangutu/p4k"
Issues = "https://github.com/luciangutu/p4k/issues"

[project.scripts]
p4k = "p4k.app:main"

[tool.setuptools.packages.find]
include = ["p4k*"]

[tool.setuptools.dynamic]
# Single source of truth for the version: p4k/__init__.py
version = { attr = "p4k.__version__" }
